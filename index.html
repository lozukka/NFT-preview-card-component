<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  
  <title>Frontend Mentor | NFT preview card component</title>

</head>
<body>
<main>
  <section id="top">
    <div id="image"><img src="./images/image-equilibrium.jpg" alt="Image of Equilibrium"></div>
    <div id="description">
      <div id="description-top">
        <h1>Equilibrium #3429</h1>
        <p>Our Equilibrium collection promotes balance and calm.</p>
      </div>
      <div id="description-bottom">
        <div><img src="./images/icon-ethereum.svg" alt="Ethereum icon" width="11" height="18"><p id="size">0.041 ETH</p></div>
        <div><img src="./images/icon-clock.svg" alt="Clock icon" width="17" height="17"><p id="time">3 days left</p></div>
      </div>
    </div>
  </section>
  <section id="bottom">
    <div id="line"><hr></div>
    <div id="creator">
      <div id="avatar-img"><img src="./images/image-avatar.png" alt="Profile picture of Jules Wyvern"></div>
      <p>Creation of Jules Wyvern</p></div>
  </section>
</main>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by Lotta.
  </div>
</body>
</html>
